<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagas</title>
<meta name="theme-color" content="#0a0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:19px; --measure:38rem; --ff:var(--serif);
  --r-card:14px; --r-btn:10px; --r-cover:6px;
}
[data-theme="dark"]{
  --bg:#0a0d12; --surface:#141920; --surface2:#1b222b; --ink:#e3e7ec; --muted:#8f9aa7;
  --line:#262d36; --accent:#7db4d3; --on-accent:#0e1217; --sys:#121b24;
}
[data-theme="light"]{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#e6eaef; --ink:#1b2129; --muted:#5d6875;
  --line:#d9dee4; --accent:#2b6a8f; --on-accent:#ffffff; --sys:#e6eef4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);transition:background .25s,color .25s}
button,a{font:inherit;color:inherit}
a{text-decoration:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.1rem}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:calc(.9rem + env(safe-area-inset-top)) 0 .9rem}
.top .voltar{display:inline-flex;align-items:center;gap:.4rem;color:var(--muted);padding:.4rem .2rem;font-size:.95rem}
.top .voltar:hover{color:var(--ink)}
.marca{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.icone{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icone:hover{border-color:var(--accent)}
.icone svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:0 1.3rem;border-radius:var(--r-btn);
  border:1px solid var(--line);background:var(--surface);font-weight:600;transition:transform .12s,border-color .2s,background .2s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primario:hover{filter:brightness(1.08)}

/* capas */
.capa{position:relative;aspect-ratio:2/3;border-radius:var(--r-cover);overflow:hidden;background:#0b1015;flex:none;container-type:inline-size;
  box-shadow:0 10px 28px rgba(0,0,0,.35)}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.arte{--h:205;background:
  radial-gradient(circle at 76% 20%,hsl(var(--h) 70% 88%/.95) 0 4.5%,hsl(var(--h) 70% 80%/.22) 5% 13%,transparent 14%),
  radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px) 0 0/41px 47px,
  radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 1.5px) 13px 19px/27px 31px,
  linear-gradient(165deg,hsl(var(--h) 42% 24%),hsl(var(--h) 55% 7%))}
.capa.gerada{display:flex;align-items:flex-end;padding:0 0 9%}
.capa.gerada span{display:block;width:100%;padding:0 9%;font-family:var(--serif);font-weight:700;line-height:1.02;color:#f2f6f9;font-size:clamp(.9rem,12.5cqw,2.2rem);text-shadow:0 2px 12px rgba(0,0,0,.6);word-break:break-word}
.capa.gerada::after{content:"";position:absolute;inset:6%;border:1px solid rgba(255,255,255,.22);border-radius:3px;pointer-events:none}

/* topo da home */
.nav{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;align-items:center;gap:.7rem;padding:calc(.6rem + env(safe-area-inset-top)) 1.1rem .6rem;transition:background .3s,backdrop-filter .3s}
.nav.solido{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .marca{font-family:var(--serif);font-weight:700;font-size:1.35rem;letter-spacing:.02em;margin-right:auto}
.busca{position:relative;flex:0 1 15rem;min-width:0}
.busca input{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink);padding:0 1rem;font:inherit;font-size:.95rem}
.busca input::placeholder{color:var(--muted)}
.busca input:focus{outline:none;border-color:var(--accent)}
.nav .icone{background:color-mix(in srgb,var(--surface) 85%,transparent);flex:none}

/* destaque */
.destaque{position:relative;min-height:min(80vh,44rem);display:flex;align-items:flex-end;overflow:hidden}
.destaque .fundo{position:absolute;inset:0}
.destaque .fundo img{width:100%;height:100%;object-fit:cover;object-position:top}
.destaque .fundo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,color-mix(in srgb,var(--bg) 70%,transparent) 62%,var(--bg) 95%)}
.destaque .conteudo{position:relative;width:100%;max-width:74rem;margin:0 auto;padding:0 1.1rem 1.8rem}
.destaque .generos{color:var(--muted);font-size:.9rem;margin-bottom:.5rem}
.destaque h1{font-family:var(--serif);font-size:clamp(2.2rem,9vw,4.4rem);line-height:1.02;margin:0 0 .8rem;max-width:14em}
.destaque p{max-width:34rem;margin:0 0 1.2rem;font-size:1rem;color:var(--ink);opacity:.88;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.acoes{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* fileiras */
.fileira{padding:1.2rem 0 .4rem}
.fileira h2{font-family:var(--serif);font-size:1.3rem;margin:0 0 .8rem;padding:0 1.1rem;max-width:74rem;margin-inline:auto}
.trilho{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x proximity;padding:.2rem 1.1rem 1rem;scrollbar-width:none;max-width:74rem;margin:0 auto}
.trilho::-webkit-scrollbar{display:none}
.poster{flex:none;width:9.4rem;scroll-snap-align:start;display:block}
.poster .capa{width:100%;transition:transform .2s}
.poster:hover .capa{transform:translateY(-3px)}
.poster b{display:block;margin-top:.55rem;font-size:.92rem;line-height:1.25;font-weight:600}
.poster small{color:var(--muted);font-size:.8rem}
.poster .barrinha{height:3px;background:var(--line);border-radius:2px;margin-top:.5rem;overflow:hidden}
.poster .barrinha i{display:block;height:100%;background:var(--accent)}
@media(min-width:800px){.poster{width:11.5rem}}
.resultados{max-width:74rem;margin:0 auto;padding:6rem 1.1rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));gap:1.2rem}
.resultados .poster{width:auto}
.resultados .vazio{grid-column:1/-1}
.rodape{max-width:74rem;margin:0 auto;padding:2rem 1.1rem 3rem;color:var(--muted);font-size:.85rem}
.meta{display:flex;flex-wrap:wrap;gap:.2rem .9rem;color:var(--muted);font-size:.85rem;margin-bottom:.9rem}

/* obra */
.obra-topo{display:grid;grid-template-columns:1fr;gap:1.4rem;padding:.6rem 0 1.6rem}
.obra-topo .capa{width:min(52%,210px)}
.obra-topo h1{font-family:var(--serif);font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.1;margin:0 0 .6rem}
.sinopse{color:var(--ink);opacity:.86;font-family:var(--serif);font-size:1.02rem;line-height:1.65;max-width:38rem;margin:1rem 0 1.3rem}
.acoes{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.acoes small{color:var(--muted)}
.lista-cap{list-style:none;margin:0;padding:0 0 3rem;display:grid;gap:.5rem}
.lista-cap h2{font-family:var(--serif);font-size:1.3rem;margin:1rem 0 .8rem}
.cap{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:center;gap:.8rem;padding:.9rem 1rem;min-height:56px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:border-color .2s}
.cap:hover{border-color:var(--accent)}
.cap .n{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:1.05rem;font-variant-numeric:tabular-nums}
.cap .t{font-weight:600}
.cap .s{font-size:.8rem;color:var(--muted);white-space:nowrap}
.cap.lido .t{color:var(--muted)}
@media(min-width:640px){.obra-topo{grid-template-columns:210px 1fr;gap:2rem;align-items:start}.obra-topo .capa{width:100%}}

/* leitor */
.progresso{position:fixed;left:0;right:0;top:0;height:3px;z-index:30;background:transparent}
.progresso i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.barra{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.barra .in{max-width:62rem;margin:0 auto;padding:calc(.5rem + env(safe-area-inset-top)) 1.1rem .5rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.barra .voltar{display:flex;align-items:center;gap:.4rem;color:var(--muted);min-height:42px;min-width:0}
.barra .voltar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .voltar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.aa{font-family:var(--serif);font-weight:700;font-size:1rem}
.painel{position:absolute;right:1.1rem;top:calc(100% + .4rem);width:min(21rem,calc(100vw - 2.2rem));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:1rem;box-shadow:0 18px 40px rgba(0,0,0,.35);display:grid;gap:1rem}
.painel[hidden]{display:none}
.painel label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.3rem;background:var(--surface2);padding:.25rem;border-radius:12px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:0 0 0 1px var(--accent) inset;font-weight:600}
.seg .val{display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.texto{max-width:var(--measure);margin:0 auto;padding:2.2rem 1.25rem 2rem;font-family:var(--ff);font-size:var(--fs);line-height:1.75}
.texto.entra{animation:entra .35s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.texto .num{font-family:var(--sans);color:var(--accent);font-weight:600;font-size:.8em;margin:0 0 .4em}
.texto h1{font-family:var(--serif);font-size:1.75em;line-height:1.2;margin:0 0 1.6em;font-weight:700}
.texto p{margin:0 0 .95em;overflow-wrap:anywhere}
.texto hr{border:0;text-align:center;margin:2em 0;height:1em;color:var(--muted)}
.texto hr::before{content:"◇";letter-spacing:.6em;font-size:.8em}
.sistema{margin:1.3em 0;padding:.85em 1.1em .35em;background:var(--sys);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;font-family:var(--sans);font-size:.88em;line-height:1.55}
.sistema p{margin:0 0 .55em;color:var(--ink)}
.pager{max-width:var(--measure);margin:0 auto;padding:1rem 1.25rem calc(3rem + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.pager .btn{min-height:54px;flex-direction:column;gap:0;line-height:1.25;padding:.5rem .8rem;text-align:center}
.pager small{font-weight:400;color:var(--muted);font-size:.75rem}
.pager .btn.primario small{color:inherit;opacity:.8}
.pager .cheio{grid-column:1/-1}
.vazio{padding:4rem 0;text-align:center;color:var(--muted)}
.vazio .btn{margin-top:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<!--
  COMO ADICIONAR CAPÍTULOS OU OBRAS
  Tudo fica no bloco JSON abaixo (id="dados").
  - Novo capítulo: copie um item de "capitulos", mude "numero", "titulo" e "conteudo".
    Cada linha do "conteudo" vira um parágrafo. A ordem no JSON não importa: o site ordena pelo número.
    Uma linha só com ─── vira separador de cena. Linhas inteiras entre [colchetes] viram janela do sistema.
  - Nova obra: adicione outro objeto em "obras" com id, titulo, sinopse, generos, capitulos. As fileiras da tela inicial se montam sozinhas: Novidades, uma por gênero (ex.: "Ação", "Terror") e "Em destaque" para obras com "destaque": true. O nome do site fica em "site.titulo".
  - Capa: coloque a imagem em assets/capas/ e preencha "capa": "assets/capas/arquivo.jpg". Sem capa, o site gera uma.
-->
<script id="dados" type="application/json">{
 "site": {
  "titulo": "Sagas"
 },
 "obras": [
  {
   "id": "the-author-of-the-novel",
   "titulo": "THE AUTHOR OF THE NOVEL",
   "autor": "",
   "generos": [
    "Fantasia",
    "Anime"
   ],
   "status": "Em andamento",
   "capa": "",
   "cor": 205,
   "sinopse": "Shinji Takoyama passou cerca de 26 anos criando um universo inteiro para escapar da própria realidade. Depois de publicar sua obra, recebeu elogios e críticas, e queria revisá-la, mas morreu antes de conseguir. Ao despertar em um mundo de neve, percebe que está dentro da história que escreveu, e que ela não é exatamente como ele lembra.",
   "capitulos": [
    {
     "numero": 1,
     "titulo": "O fim de uma história",
     "conteudo": "Shinji Takoyama nunca soube exatamente quando começou a ficar sozinho.\nTalvez tivesse sido quando era criança.\nTalvez antes mesmo disso.\nEle não conseguia apontar um momento específico e dizer: foi aqui que tudo mudou.\nApenas sabia que, conforme os anos passavam, as pessoas ao seu redor desapareciam.\nAlgumas iam embora.\nOutras simplesmente deixavam de procurá-lo.\nE algumas nunca chegaram a fazer parte de sua vida.\nTakoyama se acostumou.\nAos poucos, sua casa ficou silenciosa.\nDepois, sua rotina ficou silenciosa.\nPor fim, ele também ficou.\nHavia apenas uma coisa que nunca o abandonava.\nUma história.\n\n───\n\nO quarto estava iluminado apenas pela luz do monitor.\nEram quase três da manhã.\nTakoyama estava sentado diante da escrivaninha, com os olhos cansados e uma caneca de café já fria ao lado do teclado.\nNa tela havia um documento enorme.\nCentenas de páginas.\nPersonagens.\nCidades.\nConflitos.\nMonstros.\nAcademias.\nPoderes.\nHistórias que ele havia criado durante anos.\nEle rolou a página lentamente.\nParou em um trecho específico.\nShinji Liebert.\nTakoyama ficou olhando para aquele nome.\n— Você ainda está aqui...\nEle sorriu de leve.\nLiebert era o protagonista.\nUm garoto gentil demais para aquele mundo.\nCalmo.\nEducado.\nQuase incapaz de odiar alguém.\nE, apesar disso, Takoyama havia colocado aquele garoto em situações cada vez mais difíceis.\nNão porque o odiasse.\nEra justamente o contrário.\nLiebert era provavelmente o personagem de quem mais gostava.\nTalvez porque houvesse algo dele naquele garoto.\nNão exatamente quem Takoyama era.\nMas quem gostaria de ter sido.\nCorajoso.\nGentil.\nCapaz de confiar nas pessoas.\nCapaz de ter amigos.\nCapaz de proteger alguém.\nTakoyama encostou-se na cadeira.\n— Você é muito melhor do que eu.\nEle soltou uma pequena risada.\nNaquela época, ninguém sabia quem era Shinji Takoyama.\nE ele não se importava.\nA história nunca havia sido criada para torná-lo famoso.\nEle simplesmente preci function poster(o, continuar) {
  const e = estadoObra(o), n = e.caps.length;
  const href = continuar && e.retomar ? `#/ler/${encodeURIComponent(o.id)}/${e.alvo}` : `#/obra/${encodeURIComponent(o.id)}`;
  return `<a class="poster" href="${href}">${capaHTML(o)}<b>${esc(o.titulo)}</b>
    <small>${continuar && e.retomar ? "Capítulo " + pad(e.alvo) : plural(n, "capítulo", "capítulos")}</small>
    ${continuar && e.retomar ? `<div class="barrinha"><i style="width:${Math.round(e.pct * 100)}%"></i></div>` : ""}</a>`;
}
function fileira(titulo, lista, continuar) {
  return lista.length ? `<section class="fileira"><h2>${esc(titulo)}</h2><div class="trilho">${lista.map(o => poster(o, continuar)).join("")}</div></section>` : "";
}
function fileiras() {
  const generos = [...new Set(obras.flatMap(o => o.generos || []))];
  return fileira("Continue lendo", obras.filter(o => estadoObra(o).retomar), true)
    + fileira("Em destaque", obras.filter(o => o.destaque))
    + fileira("Novidades", [...obras].reverse())
    + generos.map(g => fileira(g, obras.filter(o => (o.generos || []).includes(g)))).join("");
}
function viewHome() {
  const nome = DADOS.site?.titulo || "Sagas";
  document.title = nome;
  const d = obras.find(o => o.destaque) || obras[0];
  let hero = "";
  if (d) {
    const e = estadoObra(d);
    hero = `<section class="destaque"><div class="fundo">${d.capa ? `<img src="${esc(d.capa)}" alt="">` : `<div class="arte" style="--h:${hue(d)};position:absolute;inset:0"></div>`}</div>
      <div class="conteudo">
        <div class="generos">${esc((d.generos || []).join(", "))}</div>
        <h1>${esc(d.titulo)}</h1>
        <p>${esc(d.sinopse || "")}</p>
        <div class="acoes">
          ${e.caps.length ? `<a class="btn primario" href="#/ler/${encodeURIComponent(d.id)}/${e.alvo}">${e.retomar ? "Continuar leitura" : "Ler agora"}</a>` : ""}
          <a class="btn" href="#/obra/${encodeURIComponent(d.id)}">Ver capítulos</a>
        </div></div></section>`;
  }
  app.innerHTML = `<header class="nav" id="nav"><span class="marca">${esc(nome)}</span>
      <div class="busca"><input id="busca" type="search" placeholder="Buscar histórias" aria-label="Buscar histórias"></div>${botaoTema()}</header>
    <main id="conteudo">${hero}${fileiras() || '<p class="vazio">Nenhuma obra publicada ainda.</p>'}</main>`;
  const nav = $("#nav"), marca = () => nav.classList.toggle("solido", scrollY > 40);
  marca(); window.onscroll = marca;
  $("#busca").oninput = e => {
    const q = semAcento(e.target.value.trim());
    if (!q) { $("#conteudo").innerHTML = hero + fileiras(); nav.classList.toggle("solido", scrollY > 40); return; }
    const r = obras.filter(o => semAcento([o.titulo, o.sinopse, ...(o.generos || [])].join(" ")).includes(q));
    $("#conteudo").innerHTML = `<div class="resultados">${r.map(o => poster(o)).join("") || '<p class="vazio">Nenhuma história encontrada.</p>'}</div>`;
    nav.classList.add("solido");
  };
  ligarTema();
}

/* ---------- obra ---------- */
function viewObra(o) {
  document.title = o.titulo;
  const caps = capsOrdenados(o), P = progObra(o.id);
  const retomar = P.ultimo != null && caps.some(c => Number(c.numero) === Number(P.ultimo));
  const alvo = retomar ? P.ultimo : caps[0]?.numero;
  const pctUlt = retomar ? Math.round((P.pos[P.ultimo] || 0) * 100) : 0;
  const lista = caps.map(c => {
    const lido = P.lido[c.numero], pos = Math.round((P.pos[c.numero] || 0) * 100);
    const st = lido ? "Lido" : pos > 2 ? pos + "%" : "";
    return `<li><a class="cap ${lido ? "lido" : ""}" href="#/ler/${encodeURIComponent(o.id)}/${c.numero}">
      <span class="n">${pad(c.numero)}</span><span class="t">${esc(c.titulo)}</span><span class="s">${st}</span></a></li>`;
  }).join("");
  app.innerHTML = `<div class="wrap">
    <div class="top"><a class="voltar" href="#/">${ICON.back.replace("<svg", '<svg width="20" height="20"')}<span>Início</span></a>${botaoTema()}</div>
    <section class="obra-topo">
      ${capaHTML(o)}
      <div>
        <h1>${esc(o.titulo)}</h1>
        <div class="meta">${o.autor ? `<span>${esc(o.autor)}</span>` : ""}${(o.generos || []).length ? `<span>${esc(o.generos.join(", "))}</span>` : ""}<span>${plural(caps.length, "capítulo disponível", "capítulos disponíveis")}</span>${o.status ? `<span>${esc(o.status)}</span>` : ""}</div>
        <p class="sinopse">${esc(o.sinopse || "")}</p>
        ${caps.length ? `<div class="acoes"><a class="btn primario" href="#/ler/${encodeURIComponent(o.id)}/${alvo}">${retomar ? "Continuar leitura" : "Começar a leitura"}</a>${retomar ? `<small>Capítulo ${pad(P.ultimo)}${pctUlt > 2 ? ", " + pctUlt + "%" : ""}</small>` : ""}</div>` : ""}
      </div>
    </section>
    <ul class="lista-cap"><li><h2>Capítulos</h2></li>${lista || '<li class="vazio">Ainda não há capítulos publicados.</li>'}</ul></div>`;
  ligarTema();
}

/* ---------- leitor ---------- */
let leitor = null; // { obra, cap } enquanto o leitor está aberto
const pctScroll = () => { const h = document.documentElement.scrollHeight - innerHeight; return h > 0 ? Math.min(1, Math.max(0, scrollY / h)) : 1; };
function salvarAgora() { if (leitor) salvarProg(leitor.obra, leitor.cap, pctScroll()); }
let tSalvar;
addEventListener("scroll", () => {
  if (!leitor) return;
  const b = $(".progresso i"); if (b) b.style.transform = `scaleX(${pctScroll()})`;
  clearTimeout(tSalvar); tSalvar = setTimeout(salvarAgora, 250);
}, { passive: true });
addEventListener("pagehide", salvarAgora);

function seg(nome, opcoes) {
  return `<div class="seg" data-pref="${nome}">${opcoes.map(([v, t]) => `<button data-v="${v}" aria-pressed="${String(prefs[nome]) === String(v)}">${t}</button>`).join("")}</div>`;
}
function viewLeitor(o, numero) {
  const caps = capsOrdenados(o), i = caps.findIndex(c => Number(c.numero) === Number(numero));
  if (i < 0) return viewNaoEncontrado();
  const c = caps[i], ant = caps[i - 1], prox = caps[i + 1];
  document.title = `${pad(c.numero)}. ${c.titulo} · ${o.titulo}`;
  const base = `#/ler/${encodeURIComponent(o.id)}/`;
  app.innerHTML = `
    <div class="progresso"><i></i></div>
    <header class="barra"><div class="in">
      <a class="voltar" href="#/obra/${encodeURIComponent(o.id)}">${ICON.back}<span>${esc(o.titulo)}</span></a>
      <div style="display:flex;gap:.5rem">
        <button class="icone aa" id="btnAa" aria-label="Ajustes de leitura" aria-expanded="false">Aa</button>
      </div>
      <div class="painel" id="painel" hidden>
        <div><label>Tamanho da fonte</label>
          <div class="seg" style="grid-template-columns:1fr 1fr 1fr;grid-auto-flow:row">
            <button id="fMenos" aria-label="Diminuir fonte">A−</button><span class="val" id="fVal">${prefs.fonte}px</span><button id="fMais" aria-label="Aumentar fonte">A+</button>
          </div></div>
        <div><label>Largura do texto</label>${seg("largura", [["estreita", "Estreita"], ["media", "Média"], ["larga", "Larga"]])}</div>
        <div><label>Fonte do texto</label>${seg("familia", [["serif", "Com serifa"], ["sans", "Sem serifa"]])}</div>
        <div><label>Tema</label>${seg("tema", [["light", "Claro"], ["dark", "Escuro"]])}</div>
      </div>
    </div></header>
    <article class="texto entra">
      <p class="num">Capítulo ${pad(c.numero)}</p>
      <h1>${esc(c.titulo)}</h1>
      ${corpo(c.conteudo || "")}
    </article>
    <nav class="pager" aria-label="Navegação entre capítulos">
      ${ant ? `<a class="btn" href="${base}${ant.numero}"><small>Anterior</small>${pad(ant.numero)}. ${esc(ant.titulo)}</a>` : `<span></span>`}
      ${prox ? `<a class="btn primario" href="${base}${prox.numero}"><small>Próximo</small>${pad(prox.numero)}. ${esc(prox.titulo)}</a>`
             : `<a class="btn" href="#/obra/${encodeURIComponent(o.id)}"><small>Fim dos capítulos disponíveis</small>Voltar para a obra</a>`}
    </nav>`;

  // controles
  const painel = $("#painel"), btn = $("#btnAa");
  btn.onclick = e => { e.stopPropagation(); painel.hidden = !painel.hidden; btn.setAttribute("aria-expanded", !painel.hidden); };
  painel.onclick = e => e.stopPropagation();
  const fecharPainel = () => { painel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
  document.onclick = fecharPainel;
  document.onkeydown = e => { if (e.key === "Escape") fecharPainel(); };
  const mudaFonte = d => {
    const antes = pctScroll();
    prefs.fonte = Math.min(26, Math.max(15, prefs.fonte + d)); aplicarPrefs();
    $("#fVal").textContent = prefs.fonte + "px";
    scrollTo(0, antes * (document.documentElement.scrollHeight - innerHeight));
  };
  $("#fMenos").onclick = () => mudaFonte(-1);
  $("#fMais").onclick = () => mudaFonte(1);
  painel.querySelectorAll(".seg[data-pref] button").forEach(b => b.onclick = () => {
    const nome = b.parentElement.dataset.pref, antes = pctScroll();
    prefs[nome] = b.dataset.v; aplicarPrefs();
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (nome === "tema") document.querySelectorAll("[data-tema]").forEach(x => x.innerHTML = prefs.tema === "dark" ? ICON.sun : ICON.moon);
    scrollTo(0, antes * (document.documentElement.scrollHeight - innerHeight));
  });

  // posição: retoma de onde parou ou começa do topo
  const pos = progObra(o.id).pos[c.numero] || 0;
  scrollTo(0, 0);
  const restaurar = () => {
    if (pos > 0.02 && pos < 0.97) scrollTo(0, pos * (document.documentElement.scrollHeight - innerHeight));
    $(".progresso i").style.transform = `scaleX(${pctScroll()})`;
    leitor = { obra: o.id, cap: c.numero };
    salvarProg(o.id, c.numero, pctScroll());
  };
  const fontes = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontes, new Promise(r => setTimeout(r, 500))]).then(() => requestAnimationFrame(restaurar));
}

function viewNaoEncontrado() {
  app.innerHTML = `<div class="wrap"><div class="vazio"><p>Não encontramos essa página.</p><a class="btn primario" href="#/">Ir para a biblioteca</a></div></div>`;
}

/* ---------- rotas (#/, #/obra/id, #/ler/id/numero) ---------- */
function rota() {
  salvarAgora(); leitor = null;
  document.onclick = null; document.onkeydown = null; window.onscroll = null;
  const [tipo, id, n] = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const o = obras.find(x => x.id === id);
  if (tipo === "obra" && o) { viewObra(o); scrollTo(0, 0); }
  else if (tipo === "ler" && o) viewLeitor(o, n);
  else if (!tipo) { viewHome(); scrollTo(0, 0); }
  else { viewNaoEncontrado(); }
}
addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
